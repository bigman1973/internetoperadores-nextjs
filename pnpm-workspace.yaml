allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  canvas: set this to true or false
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

onlyBuiltDependencies:
  - '@prisma/engines'
  - prisma

# This detached checkout intentionally reuses an owner-provided node_modules
# symlink. Running a test must not cause pnpm to replace it with an install.
verifyDepsBeforeRun: false
