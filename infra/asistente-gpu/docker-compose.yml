# Host dedicado y aislado. No ejecutar `docker pull` aquí: cargar sólo tar OCI verificados.
# Las etiquetas son versiones exactas; ARTIFACTS.sha256 e images.lock verifican su procedencia/digest.
name: io-asistente

x-seguridad: &seguridad
  restart: unless-stopped
  pull_policy: never
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-limites: &limites
  cpus: "2.0"
  mem_limit: 4g
  pids_limit: 256

services:
  caddy:
    <<: [*seguridad, *limites]
    image: caddy:2.10.0-alpine
    ports:
      - "443:8443"
    environment:
      CADDY_GATEWAY_TOKEN: ${CADDY_GATEWAY_TOKEN:?definir_en_.env}
      VLLM_INTERNAL_API_KEY: ${VLLM_INTERNAL_API_KEY:?definir_en_.env}
      ASSISTANT_RAG_API_KEY: ${ASSISTANT_RAG_API_KEY:?definir_en_.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/run/certs:ro
    networks: [borde, interna]
    read_only: true
    tmpfs:
      - /config:uid=0,gid=0,mode=700
      - /data:uid=0,gid=0,mode=700
      - /tmp:uid=0,gid=0,mode=1777
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      asistente-rag:
        condition: service_healthy
      vllm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

  asistente-rag:
    <<: [*seguridad, *limites]
    image: io-assistant-rag:1.0.0
    environment:
      ASSISTANT_RAG_API_KEY: ${ASSISTANT_RAG_API_KEY:?definir_en_.env}
      ASSISTANT_RAG_BACKEND: ${ASSISTANT_RAG_BACKEND:-real}
      ASSISTANT_MODELS_DIR: /models
      ASSISTANT_EMBEDDINGS_MODEL: ${ASSISTANT_EMBEDDINGS_MODEL:-bge-m3}
      ASSISTANT_RERANK_MODEL: ${ASSISTANT_RERANK_MODEL:-bge-reranker-v2-m3}
      ASSISTANT_SPACY_MODEL: ${ASSISTANT_SPACY_MODEL:-es_core_news_lg}
      ASSISTANT_RERANK_ENABLED: ${ASSISTANT_RERANK_ENABLED:-false}
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_UPDATE_CHECK: "1"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_DATASETS_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      DO_NOT_TRACK: "1"
      OTEL_SDK_DISABLED: "true"
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - ./models:/models:ro
    expose:
      - "8080"
    networks: [interna]
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    mem_limit: 12g
    cpus: "6.0"
    pids_limit: 512
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s

  vllm:
    <<: *seguridad
    image: vllm/vllm-openai:v0.13.0
    command:
      - --model=${VLLM_MODEL_PATH:-/models/Qwen3-32B-AWQ}
      - --served-model-name=${VLLM_SERVED_MODEL_NAME:-io-qwen3-32b-awq}
      - --quantization=awq
      - --max-model-len=8192
      - --gpu-memory-utilization=0.85
      - --max-num-seqs=16
      - --disable-log-requests
      - --api-key=${VLLM_INTERNAL_API_KEY:?definir_en_.env}
    environment:
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_UPDATE_CHECK: "1"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_DATASETS_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      DO_NOT_TRACK: "1"
      VLLM_NO_USAGE_STATS: "1"
      VLLM_DO_NOT_TRACK: "1"
      VLLM_LOGGING_LEVEL: WARNING
      OTEL_SDK_DISABLED: "true"
    volumes:
      - ./models:/models:ro
    expose:
      - "8000"
    networks: [interna]
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /root/.cache:mode=700
    cpus: "12.0"
    mem_limit: 72g
    pids_limit: 2048
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 120s

  redis:
    <<: [*seguridad, *limites]
    image: redis:7.4.1-alpine
    profiles: ["estado"]
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1", "--protected-mode", "yes"]
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    networks: [interna]
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    mem_limit: 2g
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5

  langfuse-web:
    <<: [*seguridad, *limites]
    image: langfuse/langfuse:3.55.0
    profiles: ["observabilidad"]
    environment:
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD:?definir_en_.env}@langfuse-db:5432/langfuse
      CLICKHOUSE_URL: http://clickhouse:8123
      REDIS_CONNECTION_STRING: redis://redis:6379/1
      S3_EVENT_UPLOAD_BUCKET: langfuse
      S3_EVENT_UPLOAD_REGION: local
      S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?definir_en_.env}
      S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?definir_en_.env}
      S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?definir_en_.env}
      SALT: ${LANGFUSE_SALT:?definir_en_.env}
      NEXTAUTH_URL: https://langfuse.local
      TELEMETRY_ENABLED: "false"
      LANGFUSE_TRACING_ENABLED: "false"
      LANGFUSE_IN_APP_AGENT_ENABLED: "false"
      LANGFUSE_DISABLE_SIGNUP_ONBOARDING: "true"
      DO_NOT_TRACK: "1"
      OTEL_SDK_DISABLED: "true"
    expose:
      - "3000"
    networks: [interna]
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    depends_on:
      redis:
        condition: service_healthy
      langfuse-db:
        condition: service_started
      clickhouse:
        condition: service_started
      minio:
        condition: service_started

  langfuse-worker:
    <<: [*seguridad, *limites]
    image: langfuse/langfuse-worker:3.55.0
    profiles: ["observabilidad"]
    environment:
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD:?definir_en_.env}@langfuse-db:5432/langfuse
      CLICKHOUSE_URL: http://clickhouse:8123
      REDIS_CONNECTION_STRING: redis://redis:6379/1
      S3_EVENT_UPLOAD_BUCKET: langfuse
      S3_EVENT_UPLOAD_REGION: local
      S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?definir_en_.env}
      S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?definir_en_.env}
      S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      TELEMETRY_ENABLED: "false"
      LANGFUSE_TRACING_ENABLED: "false"
      LANGFUSE_IN_APP_AGENT_ENABLED: "false"
      DO_NOT_TRACK: "1"
      OTEL_SDK_DISABLED: "true"
    networks: [interna]
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    depends_on:
      langfuse-web:
        condition: service_started

  langfuse-db:
    <<: [*seguridad, *limites]
    image: postgres:17.4-alpine
    profiles: ["observabilidad"]
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:?definir_en_.env}
    volumes:
      - langfuse-postgres:/var/lib/postgresql/data
    expose:
      - "5432"
    networks: [interna]
    mem_limit: 4g
    cpus: "2.0"

  clickhouse:
    <<: [*seguridad, *limites]
    image: clickhouse/clickhouse-server:24.8.14-alpine
    profiles: ["observabilidad"]
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      DO_NOT_TRACK: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    expose:
      - "8123"
      - "9000"
    networks: [interna]
    mem_limit: 8g
    cpus: "4.0"

  minio:
    <<: [*seguridad, *limites]
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    profiles: ["observabilidad"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?definir_en_.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?definir_en_.env}
      MINIO_PROMETHEUS_AUTH_TYPE: public
      DO_NOT_TRACK: "1"
    volumes:
      - minio-data:/data
    expose:
      - "9000"
      - "9001"
    networks: [interna]
    mem_limit: 4g
    cpus: "2.0"

networks:
  borde:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24
  interna:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  redis-data:
  langfuse-postgres:
  clickhouse-data:
  minio-data:
